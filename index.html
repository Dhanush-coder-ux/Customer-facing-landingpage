<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary SEO Metadata -->
    <title>ShopiQ – Discover Hidden Stores &amp; Shop Local Online</title>
    <meta
      name="description"
      content="Discover hidden stores near you, shop online from your favourite local stores, check availability before you visit, and find what you need nearby with ShopiQ on Android."
    />
    <meta name="keywords" content="ShopiQ, local shopping, hidden stores near me, shop local stores online, check availability in store, find products nearby, Android shopping app" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://shopiq.app/" />
    <meta name="theme-color" content="#F97316" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shopiq.app/" />
    <meta property="og:title" content="ShopiQ – Discover Hidden Stores &amp; Shop Local Online" />
    <meta
      property="og:description"
      content="Discover hidden stores near you, shop online from your favourite local stores, check availability before you visit, and find what you need nearby with ShopiQ on Android."
    />
    <meta property="og:image" content="https://shopiq.app/logo/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="ShopiQ" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shopiq.app/" />
    <meta name="twitter:title" content="ShopiQ – Discover Hidden Stores &amp; Shop Local Online" />
    <meta
      name="twitter:description"
      content="Discover hidden stores near you, shop online from your favourite local stores, check availability before you visit, and find what you need nearby with ShopiQ on Android."
    />
    <meta name="twitter:image" content="https://shopiq.app/logo/icon-512.png" />

    <!-- Typography (Font Preconnect & Display Swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ShopiQ",
        "operatingSystem": "Android",
        "applicationCategory": "ShoppingApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Discover hidden stores near you, shop online from your favourite local stores, check availability before you visit, and find what you need nearby with ShopiQ on Android.",
        "image": "https://shopiq.app/logo/icon-512.png",
        "url": "https://shopiq.app/",
        "author": {
          "@type": "Organization",
          "name": "ShopiQ Team"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
