<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary SEO Metadata -->
    <title>ShopIQ – Discover &amp; Shop Your Favorite Digital Stores</title>
    <meta
      name="description"
      content="ShopIQ is your all-in-one mobile shopping companion. Discover verified digital stores, browse curated products, and enjoy a seamless mobile checkout experience on Android."
    />
    <meta name="keywords" content="ShopIQ, mobile shopping, digital stores, ecommerce app, Android shopping, curated products, verified merchants" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://shopiq.app/" />
    <meta name="theme-color" content="#F97316" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shopiq.app/" />
    <meta property="og:title" content="ShopIQ – Discover &amp; Shop Your Favorite Digital Stores" />
    <meta
      property="og:description"
      content="Discover verified digital stores, browse curated products, and enjoy a seamless mobile checkout experience with ShopIQ for Android."
    />
    <meta property="og:image" content="https://shopiq.app/logo/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="ShopIQ" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shopiq.app/" />
    <meta name="twitter:title" content="ShopIQ – Discover &amp; Shop Your Favorite Digital Stores" />
    <meta
      name="twitter:description"
      content="Discover verified digital stores, browse curated products, and enjoy a seamless mobile checkout experience with ShopIQ for Android."
    />
    <meta name="twitter:image" content="https://shopiq.app/logo/icon-512.png" />

    <!-- Typography (Font Preconnect & Display Swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ShopIQ",
        "operatingSystem": "Android",
        "applicationCategory": "ShoppingApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Discover products, explore verified digital stores, and enjoy a simple mobile shopping experience with ShopIQ for Android.",
        "image": "https://shopiq.app/logo/icon-512.png",
        "url": "https://shopiq.app/",
        "author": {
          "@type": "Organization",
          "name": "ShopIQ Team"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
